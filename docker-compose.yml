services:
  inventory-api:
    build: ./src/Inventory.Api
    ports: ["5101:8080"]
    environment:
      ConnectionStrings__Database: Data Source=/data/inventory.db
    volumes: ["inventory-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  billing-api:
    build: ./src/Billing.Api
    ports: ["5102:8080"]
    environment:
      ConnectionStrings__Database: Data Source=/data/billing.db
      InventoryUrl: http://inventory-api:8080
    volumes: ["billing-data:/data"]
    depends_on:
      inventory-api:
        condition: service_healthy
  web:
    build: ./src/web
    ports: ["4200:80"]
    depends_on: [inventory-api, billing-api]
volumes:
  inventory-data:
  billing-data:
